name: release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    name: version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make release-check

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            tool: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            tool: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            tool: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            tool: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            tool: cargo
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: ${{ matrix.tool }} build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then bin=whence.exe; else bin=whence; fi
          tar -czf "whence-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "$bin"
      - uses: actions/upload-artifact@v7
        with:
          name: whence-${{ matrix.target }}
          path: whence-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
